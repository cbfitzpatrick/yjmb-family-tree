<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YJMB Family Tree Access</title>
  <link rel="stylesheet" href="gate.css">
</head>
<body class="gate-page gate-blue" data-gate-stage="3">
  <main class="gate-content" aria-labelledby="gate-question">
    <form class="gate-form" autocomplete="off">
      <h1 id="gate-question">What's the good word?</h1>
      <label class="sr-only" for="gate-answer">Answer</label>
      <input id="gate-answer" class="gate-answer" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" required>
      <button class="gate-submit" type="submit">Submit</button>
      <p class="gate-status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <div class="gate-transition" aria-hidden="true"></div>
  <script src="gate.js"></script>
</body>
</html>
