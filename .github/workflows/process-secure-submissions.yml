name: Apply protected YJMB submissions

on:
  push:
    branches: [main]
    paths:
      - '.secure_submissions/auto/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: secure-yjmb-submission-updates
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    outputs:
      has_applied: ${{ steps.result.outputs.has_applied }}
      should_sync: ${{ steps.result.outputs.should_sync }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh latest main
        run: git pull --ff-only origin main
      - name: Check queue
        id: queue
        shell: bash
        run: |
          shopt -s nullglob
          files=(.secure_submissions/auto/*.enc.json)
          if (( ${#files[@]} == 0 )); then echo "has_files=false" >> "$GITHUB_OUTPUT"; else echo "has_files=true" >> "$GITHUB_OUTPUT"; fi
      - name: Set up Python
        if: steps.queue.outputs.has_files == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: steps.queue.outputs.has_files == 'true' || github.event_name == 'workflow_dispatch'
        run: python -m pip install -r requirements.txt
      - name: Decrypt protected master workbook
        if: steps.queue.outputs.has_files == 'true' || github.event_name == 'workflow_dispatch'
        env:
          MASTER_WORKBOOK_KEY_B64: ${{ secrets.MASTER_WORKBOOK_KEY_B64 }}
        run: python secure_workbook.py decrypt --input secure/master_workbook.enc --output "YJMB Trees.xlsx"
      - name: Migrate legacy Saxophone label
        if: steps.queue.outputs.has_files == 'true' || github.event_name == 'workflow_dispatch'
        run: >-
          python migrateSaxophoneLabelV18.py
          --workbook "YJMB Trees.xlsx"
          --apply
          --backup-dir "${{ runner.temp }}/yjmb_v18_saxophone_backup"
          --result sax_migration_result.json
      - name: Process encrypted submission queue
        if: steps.queue.outputs.has_files == 'true'
        env:
          SUBMISSION_KEY_B64: ${{ secrets.SUBMISSION_KEY_B64 }}
        run: python process_secure_queue.py --workbook "YJMB Trees.xlsx"
      - name: Inspect queue result
        id: result
        if: steps.queue.outputs.has_files == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path("queue_result.json")
          result = json.loads(result_path.read_text(encoding="utf-8")) if result_path.exists() else {}
          migration_path = Path("sax_migration_result.json")
          migration = json.loads(migration_path.read_text(encoding="utf-8")) if migration_path.exists() else {}
          migration_changed = bool(migration.get("changed"))
          has_applied = "true" if result.get("applied") or migration_changed else "false"
          has_noop = "true" if result.get("noop") else "false"
          force_sync = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          should_sync = "true" if result.get("applied") or result.get("noop") or migration_changed or force_sync else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"has_applied={has_applied}\n")
              handle.write(f"should_sync={should_sync}\n")
          print(f"Applied updates present: {has_applied}")
          print(f"Idempotent updates present: {has_noop}")
          print(f"Legacy Saxophone-label migration changed workbook: {migration_changed}")
          print(f"Public tree synchronization required: {should_sync}")
          PY
      - name: Rebuild encrypted public site
        if: steps.result.outputs.should_sync == 'true'
        env:
          TREE_DATA_KEY_B64: ${{ secrets.TREE_DATA_KEY_B64 }}
        run: >-
          python fullBandTreeGenerator.py
          --workbook "YJMB Trees.xlsx"
          --output-mode giant
          --skip-png
          --skip-svg
          --no-save-cards
          --skip-ambiguities
          --cache "${{ runner.temp }}/yjmb_ci_resolutions.json"
      - name: Verify protected workbook/site parity
        if: steps.result.outputs.should_sync == 'true'
        env:
          TREE_DATA_KEY_B64: ${{ secrets.TREE_DATA_KEY_B64 }}
        run: python verify_web_tree_parity.py --workbook "YJMB Trees.xlsx" --tree docs/data/tree_data.enc
      - name: Re-encrypt protected master workbook
        if: steps.result.outputs.has_applied == 'true'
        env:
          MASTER_WORKBOOK_KEY_B64: ${{ secrets.MASTER_WORKBOOK_KEY_B64 }}
        run: python secure_workbook.py encrypt --input "YJMB Trees.xlsx" --output secure/master_workbook.enc
      - name: Remove plaintext workbook
        if: always()
        run: rm -f "YJMB Trees.xlsx"
      - name: Commit protected update
        if: steps.queue.outputs.has_files == 'true' || steps.result.outputs.should_sync == 'true'
        run: |
          git config user.name "YJMB Protected Updater"
          git config user.email "actions@users.noreply.github.com"
          git add docs secure/master_workbook.enc secure/changelog .secure_submissions
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply protected YJMB tree submission(s)"
          git pull --rebase origin main
          git push origin main
      - name: Notify administrator about conflicts
        if: steps.queue.outputs.has_files == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python notify_review.py
      - name: Remove temporary result files
        if: always()
        run: rm -f queue_result.json sax_migration_result.json

  deploy:
    needs: apply
    if: needs.apply.outputs.should_sync == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout updated main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
